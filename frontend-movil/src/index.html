<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Basurita</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16A34A">
  <link rel="icon" type="image/x-icon" href="logo copy.ico">
  <style>
    /* Pantalla de inicio: se pinta antes de que cargue Angular */
    #splash {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 38%, #ffffff 0%, #f0fdf4 60%, #dcfce7 100%);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .45s ease, visibility .45s ease;
    }
    #splash.oculto { opacity: 0; visibility: hidden; }
    #splash .logo {
      width: 132px; height: 132px; object-fit: contain;
      border-radius: 32px; background: #fff; padding: 14px;
      box-shadow: 0 18px 40px rgba(22, 163, 74, .18);
      animation: splash-entrar .8s cubic-bezier(.2, .9, .3, 1.25) both;
    }
    #splash .nombre {
      margin-top: 22px; font-size: 30px; font-weight: 900; letter-spacing: -.5px; color: #1E293B;
      animation: splash-subir .6s .25s ease-out both;
    }
    #splash .lema {
      margin-top: 4px; font-size: 14px; color: #64748B;
      animation: splash-subir .6s .4s ease-out both;
    }
    #splash .barra {
      margin-top: 36px; width: 180px; height: 6px; border-radius: 9999px;
      background: #dcfce7; overflow: hidden;
      animation: splash-subir .5s .5s ease-out both;
    }
    #splash .barra span {
      display: block; height: 100%; width: 0; border-radius: inherit;
      background: linear-gradient(90deg, #16A34A, #0EA5E9);
      animation: splash-cargar 1.6s .55s cubic-bezier(.4, 0, .2, 1) forwards;
    }
    @keyframes splash-entrar {
      from { opacity: 0; transform: scale(.6) rotate(-12deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes splash-subir {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes splash-cargar {
      0% { width: 0; }
      60% { width: 75%; }
      100% { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash *, #splash .barra span { animation-duration: .01s !important; animation-delay: 0s !important; }
    }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-label="Cargando Basurita">
    <img class="logo" src="logo copy.ico" alt="">
    <div class="nombre">Basurita</div>
    <div class="lema">Tu basura a tiempo, tu ciudad limpia</div>
    <div class="barra"><span></span></div>
  </div>
  <app-root></app-root>
</body>
</html>

<div class="relative h-dvh w-screen flex flex-col bg-basurita-bg overflow-hidden">

  <!-- Banner de Proximidad Accesible (WCAG AA + Vibración) -->
  <app-alerta-proximidad-banner></app-alerta-proximidad-banner>

  <!-- Encabezado flotante: perfil (abre menú) + saludo + historial -->
  <div class="absolute top-0 left-0 right-0 z-[1000] p-4 pointer-events-none">
    <div class="bg-white/95 backdrop-blur-md shadow-floating rounded-full p-2 flex items-center gap-3 pointer-events-auto border border-gray-200">
      <button (click)="menuAbierto = true" aria-label="Abrir menú de perfil"
              class="w-11 h-11 shrink-0 rounded-full bg-basurita-primary text-white font-black text-lg flex items-center justify-center shadow-md active:scale-95 transition">
        {{ inicial }}
      </button>

      <div class="flex-1 min-w-0">
        <p class="text-xs text-basurita-muted leading-tight">Hola,</p>
        <p class="font-bold text-basurita-text truncate leading-tight">{{ nombre }}</p>
      </div>

      <a routerLink="/ciudadano/avisos" [attr.aria-label]="sinLeer ? 'Ver avisos, ' + sinLeer + ' sin leer' : 'Ver avisos'"
         class="relative w-11 h-11 shrink-0 rounded-full bg-basurita-primary-dark text-white flex items-center justify-center shadow-md active:scale-95 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/>
        </svg>
        <span *ngIf="sinLeer" class="absolute -top-1 -right-1 min-w-5 h-5 px-1 rounded-full bg-basurita-danger text-white text-[11px] font-black flex items-center justify-center border-2 border-white">
          {{ sinLeer > 9 ? '9+' : sinLeer }}
        </span>
      </a>
    </div>

    <!-- Aviso cuando el camión no reporta o no hay conexión -->
    <div *ngIf="alertaConexion" role="status"
         class="mt-3 mx-auto max-w-xs bg-amber-600 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg text-center flex items-center justify-center gap-2 pointer-events-auto">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
      </svg>
      <span>{{ alertaConexion }}</span>
    </div>
  </div>

  <!-- Mapa -->
  <div id="mapa-contenedor" class="flex-1 w-full z-0"></div>

  <!-- Botón centrar en mi casa -->
  <button (click)="centrarEnCasa()" aria-label="Centrar mapa en mi casa"
          class="absolute right-4 bottom-36 z-[1000] w-12 h-12 rounded-full bg-white shadow-floating flex items-center justify-center text-basurita-primary active:scale-95">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955a1.126 1.126 0 0 1 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
  </button>

  <!-- Tarjeta de estado inferior -->
  <div class="absolute bottom-6 left-4 right-4 z-[1000] pointer-events-auto">
    <app-status-card [status]="estadoCamion">
      <span title>{{ tituloEstado }}</span>
      <span description>{{ mensajeTiempo }}</span>
    </app-status-card>
  </div>

  <!-- ===== Menú lateral del perfil ===== -->
  <div *ngIf="menuAbierto" class="absolute inset-0 z-[2000]">
    <div class="absolute inset-0 bg-black/40" (click)="menuAbierto = false" aria-hidden="true"></div>

    <nav class="absolute left-0 top-0 bottom-0 w-[82%] max-w-sm bg-white shadow-2xl flex flex-col animate-[entrar_.2s_ease-out]"
         aria-label="Menú de perfil">
      <!-- Cabecera verde con datos -->
      <div class="bg-basurita-primary text-white px-6 pt-10 pb-6">
        <div class="w-16 h-16 rounded-full bg-white text-basurita-primary font-black text-2xl flex items-center justify-center mb-3">
          {{ inicial }}
        </div>
        <p class="font-bold text-lg leading-tight">{{ nombre }}</p>
        <p class="text-sm text-green-50 truncate">{{ correo }}</p>
      </div>

      <div class="flex-1 overflow-y-auto py-2">
        <a routerLink="/ciudadano/perfil" class="flex items-center gap-4 px-6 py-4 text-basurita-text font-semibold active:bg-gray-100">
          <svg class="w-6 h-6 text-basurita-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/></svg>
          Mis datos
        </a>
        <a routerLink="/ciudadano/elegir-casa" class="flex items-center gap-4 px-6 py-4 text-basurita-text font-semibold active:bg-gray-100">
          <svg class="w-6 h-6 text-basurita-primary shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/></svg>
          <span class="min-w-0">
            Ubicación de mi casa
            <span *ngIf="direccionCasa" class="block text-xs font-normal text-basurita-muted truncate">{{ direccionCasa }}</span>
          </span>
        </a>
        <a routerLink="/ciudadano/avisos" class="flex items-center gap-4 px-6 py-4 text-basurita-text font-semibold active:bg-gray-100">
          <svg class="w-6 h-6 text-basurita-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/></svg>
          <span class="flex-1">Avisos del camión</span>
          <span *ngIf="sinLeer" class="min-w-6 h-6 px-1.5 rounded-full bg-basurita-danger text-white text-xs font-black flex items-center justify-center">{{ sinLeer }}</span>
        </a>
        <a routerLink="/ciudadano/historial" class="flex items-center gap-4 px-6 py-4 text-basurita-text font-semibold active:bg-gray-100">
          <svg class="w-6 h-6 text-basurita-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 7v5l3 2"/></svg>
          Calendario de recolección
        </a>
        <a routerLink="/ciudadano/acerca" class="flex items-center gap-4 px-6 py-4 text-basurita-text font-semibold active:bg-gray-100">
          <svg class="w-6 h-6 text-basurita-primary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"/></svg>
          Acerca de Basurita
        </a>
      </div>

      <button (click)="cerrarSesion()" class="m-4 flex items-center justify-center gap-2 py-3 rounded-soft border border-red-200 text-red-700 font-bold active:bg-red-50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/></svg>
        Cerrar sesión
      </button>
    </nav>
  </div>
</div>

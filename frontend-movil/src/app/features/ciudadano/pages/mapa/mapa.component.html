<div class="relative h-screen w-screen flex flex-col bg-basurita-bg overflow-hidden">
  
  <!-- Banner de Proximidad Accesible (WCAG AA + Vibración) -->
  <app-alerta-proximidad-banner></app-alerta-proximidad-banner>

  <!-- Encabezado Flotante (Selector de Favoritos + Acceso a Historial en 1 toque) -->
  <div class="absolute top-0 left-0 right-0 z-999 p-4 pointer-events-none">
    <div class="bg-white/95 backdrop-blur-md shadow-floating rounded-full p-2 flex items-center justify-between pointer-events-auto border border-gray-200">
      
      <div class="flex gap-1 bg-gray-100 rounded-full p-1 w-full max-w-xs">
        <button (click)="cambiarUbicacion('Casa')"
                [class.bg-white]="ubicacionSeleccionada === 'Casa'"
                [class.shadow-sm]="ubicacionSeleccionada === 'Casa'"
                class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-full text-sm font-bold text-basurita-text transition-all">
          <svg class="w-4 h-4 text-basurita-primary-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
          </svg>
          Casa
        </button>
        
        <button (click)="cambiarUbicacion('Trabajo')"
                [class.bg-white]="ubicacionSeleccionada === 'Trabajo'"
                [class.shadow-sm]="ubicacionSeleccionada === 'Trabajo'"
                class="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-full text-sm font-bold text-basurita-text transition-all">
          <svg class="w-4 h-4 text-basurita-secondary-dark" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
          Trabajo
        </button>
      </div>

      <!-- Acceso directo al Historial (RNF-20) -->
      <a routerLink="/ciudadano/historial" 
         aria-label="Ver historial de recolección"
         class="w-11 h-11 ml-2 rounded-full bg-basurita-primary-dark text-white flex items-center justify-center shadow-md hover:bg-blue-800 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
        </svg>
      </a>
    </div>
    
    <!-- Alerta de conexión amigable WCAG AA -->
    <div *ngIf="alertaConexion" 
         role="status"
         class="mt-3 mx-auto max-w-xs bg-red-700 text-white text-xs font-bold px-4 py-2.5 rounded-full shadow-lg text-center flex items-center justify-center gap-2 pointer-events-auto">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
      </svg>
      <span>{{ alertaConexion }}</span>
    </div>
  </div>

  <!-- Contenedor del Mapa Leaflet -->
  <div id="mapa-contenedor" class="flex-1 w-full z-0"></div>

  <!-- Tarjeta de Estado Flotante Inferior -->
  <div class="absolute bottom-6 left-4 right-4 z-999 pointer-events-auto">
    <app-status-card [status]="estadoCamion">
      <span title>
        {{ estadoCamion === 'active' ? 'El camión está en tu ruta (' + ubicacionSeleccionada + ')' : 'Recolector aún no inicia (' + ubicacionSeleccionada + ')' }}
      </span>
      <span description>
        {{ mensajeTiempo }}
      </span>
    </app-status-card>
  </div>

</div>

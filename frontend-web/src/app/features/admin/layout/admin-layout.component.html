<div class="flex h-screen bg-basurita-bg font-sans">
  
  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-gray-200 flex flex-col max-md:hidden md:flex z-10 shadow-soft">
    <div class="h-16 flex items-center px-6 border-b border-gray-100">
      <img src="logo copy.ico" alt="Basurita Logo" class="h-8">
      <span class="ml-3 font-bold text-basurita-text text-xl">Admin</span>
    </div>
    
    <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
      <a *ngFor="let item of menuItems" 
         [routerLink]="item.route"
         routerLinkActive="bg-blue-50 text-basurita-primary font-semibold border-basurita-primary"
         class="flex items-center gap-3 px-4 py-3 text-basurita-muted rounded-soft hover:bg-gray-50 transition-colors border-l-4 border-transparent">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon"></path>
        </svg>
        {{ item.label }}
      </a>
    </nav>
    
    <div class="p-4 border-t border-gray-100">
      <button (click)="logout()" class="w-full flex items-center gap-3 px-4 py-3 text-red-600 rounded-soft hover:bg-red-50 transition-colors font-medium">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        Cerrar sesión
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden">
    <!-- Topbar (Mobile menu & Profile) -->
    <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shadow-sm z-0">
      <button class="md:hidden text-gray-500 hover:text-gray-700">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
      <div class="ml-auto flex items-center gap-4">
        <span class="text-sm font-medium text-basurita-text hidden sm:block">Centro de Control</span>
        <div class="w-9 h-9 rounded-full bg-basurita-primary text-white flex items-center justify-center font-bold">A</div>
      </div>
    </header>

    <!-- Router Outlet para el contenido -->
    <div class="flex-1 overflow-auto p-6 md:p-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
